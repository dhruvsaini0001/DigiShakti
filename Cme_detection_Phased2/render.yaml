services:
  # Backend API Service
  - type: web
    name: digishakti-backend
    runtime: python
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: digishakti-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: digishakti-frontend
    runtime: node
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: VITE_API_URL
        value: https://digishakti-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: digishakti-db
    databaseName: cme_detection
    user: cme_user
    region: oregon
    plan: free
