services:
  # Backend API Service
  - type: web
    name: digishakti-backend
    runtime: python
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: Cme_detection_Phased2/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: digishakti-db
          property: connectionString
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: digishakti-db
    databaseName: cme_detection
    user: cme_user
    region: oregon
    plan: free
